name: checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check_code:
    name: code (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: type-check
            command: "pyright"
          - check: lint
            command: "ruff check --output-format=github"
          - check: format
            command: "ruff format --check --diff"
          - check: test
            command: "pytest"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
    - name: Install dependencies
      run: |
        uv sync --locked
    - name: Run check
      run: | # zizmor: ignore[template-injection]
        # static matrix values
        uv run --no-sync ${{ matrix.command }}

  check_workflows:
    name: workflows (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            command: "actionlint"
          - check: analyse
            command: "zizmor ."
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
    - name: Install dependencies
      run: |
        uv sync --locked --only-group workflows
    - name: Run check
      run: | # zizmor: ignore[template-injection]
        # static matrix values
        uv run --no-sync ${{ matrix.command }}
