[project]
name = "secure-messaging"
version = "0.1.0"
description = "Zero-knowledge messaging web app with in-browser end-to-end encryption and two-factor authentication"
readme = "README.md"
authors = [
    { name = "Borys Piątek", email = "bordowyrys1@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "flask>=3.1.3",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["E", "W", "N", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
typeCheckingMode = "standard"
